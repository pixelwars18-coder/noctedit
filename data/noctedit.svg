<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c52"/>
      <stop offset="1" stop-color="#0b0b2c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#ddd8f2"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbc4"/>
      <stop offset="1" stop-color="#ffe866"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000018" flood-opacity="0.45"/>
    </filter>
    <mask id="crescent">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="205" cy="49" r="34" fill="#000"/>
    </mask>
  </defs>

  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="57.25" fill="none" stroke="#a9aefe" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M70 52 h86 l38 38 v104 a14 14 0 0 1 -14 14 h-110 a14 14 0 0 1 -14 -14 v-128 a14 14 0 0 1 14 -14 z" fill="url(#page)"/>
    <path d="M156 52 v24 a14 14 0 0 0 14 14 h24 z" fill="#b9b3dc"/>
  </g>

  <!-- text lines -->
  <g stroke-linecap="round" stroke-width="10">
    <line x1="80" y1="104" x2="138" y2="104" stroke="#2a2a6e"/>
    <line x1="80" y1="128" x2="168" y2="128" stroke="#a9aefe"/>
    <line x1="80" y1="152" x2="150" y2="152" stroke="#a9aefe"/>
    <line x1="80" y1="176" x2="120" y2="176" stroke="#a9aefe"/>
  </g>
  <!-- caret -->
  <rect x="130" y="163" width="7" height="27" rx="3.5" fill="#2a2a6e"/>

  <!-- crescent moon -->
  <circle cx="186" cy="64" r="36" fill="url(#moon)" mask="url(#crescent)" stroke="#0b0b2c" stroke-width="0"/>
  <circle cx="186" cy="64" r="36" fill="none" mask="url(#crescent)"/>
  <circle cx="222" cy="98" r="4" fill="#fffbc4" opacity="0.9"/>
  <circle cx="148" cy="34" r="3" fill="#fffbc4" opacity="0.7"/>
</svg>
